name: Update Medium blog feed

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-blog-feed
  cancel-in-progress: true

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Medium feed
        run: python3 scripts/update_blog_feed.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/assets/data/blog-posts.json
          if git diff --staged --quiet; then
            echo "No new posts."
          else
            git commit -m "Update blog feed from Medium"
            git push
          fi
